name: Publish release

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      bump:
        description: "Create a new patch (false recovers/verifies the current release)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: agentbridge-publish
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      pull-requests: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3.11"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          # npm uses OIDC directly; do not create an auth-token .npmrc.

      - name: Install OIDC-capable npm on the runner
        run: npm install --global npm@11.19.1 --ignore-scripts --registry=https://registry.npmjs.org

      - name: Validate, release and verify using short-lived credentials
        run: node scripts/publish-release.mjs
        env:
          GH_TOKEN: ${{ github.token }}
